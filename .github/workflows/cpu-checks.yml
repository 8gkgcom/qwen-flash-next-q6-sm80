name: CPU checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU regressions, including native Q8 decoding
        env:
          PYTHONPATH: src
          Q6_REQUIRE_CPP: '1'
        run: python -m unittest discover -s tests -v
      - name: Syntax and sensitive-data audit
        run: python scripts/audit_release.py
